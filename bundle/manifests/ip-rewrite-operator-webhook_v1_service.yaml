apiVersion: v1
kind: Service
metadata:
  name: ip-rewrite-operator-webhook
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: ip-rewrite-operator-webhook-cert
  labels:
    app.kubernetes.io/name: ip-rewrite-operator
spec:
  ports:
    - name: https
      port: 443
      targetPort: webhook
      protocol: TCP
  selector:
    app.kubernetes.io/name: ip-rewrite-operator
    control-plane: controller-manager
