---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: iprewriteconfigs.iprewrite.windowsreip.io
spec:
  group: iprewrite.windowsreip.io
  names:
    kind: IPRewriteConfig
    listKind: IPRewriteConfigList
    plural: iprewriteconfigs
    shortNames:
      - irc
    singular: iprewriteconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                targetNamespaces:
                  type: array
                  items:
                    type: string
                virtLauncherServiceAccountNames:
                  type: array
                  items:
                    type: string
                initContainerImage:
                  type: string
                initContainerPullPolicy:
                  type: string
