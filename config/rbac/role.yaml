---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ip-rewrite-operator-manager
rules:
  - apiGroups: [iprewrite.reip.io]
    resources: [iprewriteconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [iprewrite.reip.io]
    resources: [iprewriteconfigs/status]
    verbs: [get, update, patch]
  - apiGroups: [iprewrite.reip.io]
    resources: [iprewriteconfigs/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    verbs: [get, list, watch, create, update, patch]
  # Required to escalate "use" onto the managed SCC via ClusterRole (RBAC escalation rules)
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [ip-rewrite-operator]
    verbs: [use]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ip-rewrite-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ip-rewrite-operator-manager
subjects:
  - kind: ServiceAccount
    name: ip-rewrite-operator
    namespace: ip-rewrite-operator
