---
apiVersion: v1
kind: Namespace
metadata:
  name: ip-rewrite-operator
  labels:
    app.kubernetes.io/name: ip-rewrite-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ip-rewrite-operator
  namespace: ip-rewrite-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-rewrite-operator
  namespace: ip-rewrite-operator
  labels:
    app.kubernetes.io/name: ip-rewrite-operator
    control-plane: controller-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ip-rewrite-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ip-rewrite-operator
        control-plane: controller-manager
    spec:
      serviceAccountName: ip-rewrite-operator
      containers:
        - name: manager
          image: quay.io/mfagotto/ip-rewrite-operator:0.2.0
          imagePullPolicy: Always
          args:
            - --leader-elect
            - --cert-dir=/var/run/secrets/serving-cert
            - --webhook-port=9443
            - --init-container-image=quay.io/mfagotto/ip-rewrite-operator:init-0.2.0
            - --init-container-pull-policy=IfNotPresent
            - --request-kvm-device=true
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: serving-cert
              mountPath: /var/run/secrets/serving-cert
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
      volumes:
        - name: serving-cert
          secret:
            secretName: ip-rewrite-operator-webhook-cert
      terminationGracePeriodSeconds: 10
