---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: ip-rewrite-operator
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/name: ip-rewrite-operator
webhooks:
  - name: ip-rewrite.windowsreip.io
    admissionReviewVersions: [v1]
    clientConfig:
      service:
        name: ip-rewrite-operator-webhook
        namespace: ip-rewrite-operator
        path: /mutate-v1-pod
        port: 443
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 10
    objectSelector:
      matchLabels:
        iprewrite.windowsreip.io/enabled: "true"
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
