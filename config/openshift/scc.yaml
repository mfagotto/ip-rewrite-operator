---
# Mirrors kubevirt-controller enough for virt-launcher + IP rewrite init
# (UID 107 qemu, no SYS_ADMIN; libguestfs direct backend).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: ip-rewrite-operator
  labels:
    app.kubernetes.io/name: ip-rewrite-operator
  annotations:
    kubernetes.io/description: SCC for virt-launcher pods with IP rewrite init container
allowedCapabilities:
  - NET_BIND_SERVICE
  - SYS_NICE
volumes:
  - "*"
allowHostDirVolumePlugin: true
allowHostNetwork: false
allowHostPorts: false
allowHostPID: false
allowHostIPC: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: true
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
  - unconfined
  - localhost/kubevirt/kubevirt.json
# users granted via ClusterRoleBinding reconcile from IPRewriteConfig
users: []
